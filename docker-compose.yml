services:
  # Substrate chain node
  chain:
    build:
      context: ./chain
      dockerfile: Dockerfile
    container_name: subeth-chain
    ports:
      - "9944:9944"  # WebSocket RPC
      - "9933:9933"  # HTTP RPC
      - "30333:30333"  # P2P
    command:
      - "--dev"
      - "--rpc-external"
      - "--rpc-cors=all"
      - "--rpc-methods=unsafe"
      - "--unsafe-rpc-external"
    volumes:
      - chain-data:/data
    networks:
      - subeth-network

  # Subeth ETH RPC adapter
  adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subeth-adapter
    ports:
      - "8545:8545"  # ETH RPC port
    depends_on:
      chain:
        condition: service_started
    environment:
      - RUST_LOG=info
    command:
      - "--url=ws://chain:9944"
      - "--rpc-external"
      - "--rpc-port=8545"
    networks:
      - subeth-network

  # Simple dapp frontend
  dapp:
    build:
      context: ./simple-dapp
      dockerfile: Dockerfile
    container_name: subeth-dapp
    ports:
      - "3000:80"
    depends_on:
      adapter:
        condition: service_started
    networks:
      - subeth-network
    environment:
      - NODE_ENV=production

networks:
  subeth-network:
    driver: bridge

volumes:
  chain-data:
    driver: local
